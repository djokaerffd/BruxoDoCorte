<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BruxoDoCorte | Agendamento</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #0a0a12; color: #e0e0e0; margin: 0; text-align: center; }
        header { padding: 40px 20px; background: #111; border-bottom: 3px solid #3498db; }
        
        .logo { 
            width: 180px; 
            margin-bottom: 15px; 
            border-radius: 50%; 
            border: 3px solid #3498db;
            filter: grayscale(100%) brightness(1.2); 
            transition: 0.3s;
        }
        
        .container { max-width: 600px; margin: 30px auto; padding: 20px; background: #1a1a2e; border-radius: 10px; }
        select, button { width: 100%; padding: 15px; margin: 10px 0; border-radius: 5px; border: none; font-size: 16px; }
        select { background: #252545; color: white; }
        button { background-color: #3498db; color: white; font-weight: bold; cursor: pointer; transition: 0.3s; }
        button:hover { background-color: #2980b9; }
    </style>
</head>
<body>
    <header>
        <img src="https://i.postimg.cc/XX9hGGqk/Whats-App-Image-2026-07-24-at-15-14-06.jpg" alt="Logo Bruxo" class="logo">
        <h1>BruxoDoCorte</h1>
    </header>

    <div class="container">
        <h2>Agende seu Horário</h2>
        <form id="agendamentoForm">
            <label>Selecione o Serviço:</label>
            <select id="servico" required>
                <option value="Corte Degradê">Corte Degradê - R$ 50,00</option>
                <option value="Barba Terapia">Barba Terapia - R$ 30,00</option>
                <option value="Corte + Barba">Corte + Barba - R$ 75,00</option>
                <option value="Pigmentação">Pigmentação - R$ 40,00</option>
            </select>
            
            <button type="button" onclick="enviarWhatsApp()">Confirmar via WhatsApp</button>
        </form>
    </div>

    <script>
        function enviarWhatsApp() {
            const servico = document.getElementById('servico').value;
            const numeroWhatsApp = "5562994391996";
            const mensagem = `Olá! Gostaria de agendar um horário na BruxoDoCorte para: ${servico}.`;
            const url = `https://wa.me/${numeroWhatsApp}?text=${encodeURIComponent(mensagem)}`;
            window.open(url, '_blank');
        }
    </script>
</body>
</html>
